schema_version: 1
calibration:
  intrinsics: calibration/camera_intrinsics.yaml
  laser_plane: calibration/laser_plane.yaml
  extrinsics: calibration/camera_ground_extrinsics.yaml
  ground_u_compensation: calibration/ground_u_compensation.csv
extraction:
  method: steger
  profile: realtime_steger.yaml
  centroid:
    background_kernel: 51
    min_local_contrast_dn: 20.0
    centroid_window_radius: 5
    segment_min_columns: 42
    continuity_max_column_gap: 2
    continuity_max_vertical_jump: 14.0
    correction_window: 7
    correction_max_shift: 3.5
    scan_axis: column
  steger: {}
  shared_steger: {}
reconstruction:
  parallel_epsilon: 1.0e-09
  min_camera_depth_mm: 100.0
  max_camera_depth_mm: 1500.0
measurement:
  outlier_sigma_multiplier: 2.0
  outlier_max_iterations: 5
  min_baseline_points: 30
  min_height_points: 30
output:
  dir: ../output
  save_pointcloud_csv: true
  save_overlay_png: true
  save_full_pointcloud_ply: true
