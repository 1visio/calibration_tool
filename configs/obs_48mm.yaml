schema_version: 1
dataset_id: obs_48mm
output_dir: ../projects/daheng/data/obs_48mm
backend: daheng
serial_number: GCB26060793

metadata:
  purpose: surface2_q2_gap_fill
  height_mm: 48.0
  position_count: 5
  repeats_per_position: 5
  repeat_1_role: ground_proxy
  repeat_2_5_role: formal
  roi_policy: geometry_only_manual_freeze_after_capture
  c0_c1_refit: false
  residual_driven_roi: false
  mechanical_state: unchanged_from_obs_30_36_40_46_50
  laser_power: unchanged_from_current_setup_confirm_before_capture
  exposure_reference: obs_50mm_300us_provisional
  exposure_operator_confirmation_required: true

camera:
  exposure_us: 300.0
  gain_db: 0.0
  pixel_format: Mono8
  offset_x: 0
  offset_y: 0
  width: 4096
  height: 3000
  timeout_ms: 2000

quality:
  max_saturation_fraction: 0.05
  max_dark_fraction: 0.95
  min_dynamic_range_u8: 20.0
  min_laser_coverage: 0.30
  require_chessboard_detection: true
  max_chessboard_saturation_fraction: 0.005
  max_chessboard_highlight_fraction: 0.20
  max_chessboard_p995_u8: 245.0
  max_laser_saturation_fraction: 0.001
  max_laser_peak_saturation_fraction: 0.02
  max_laser_peak_near_saturation_fraction: 0.10
  max_laser_saturated_width_px: 1.0

board:
  pattern_cols: 11
  pattern_rows: 8

backend_options:
  discovery_timeout_ms: 1000

laser:
  orientation: vertical

tasks:
  - task_id: fit_001_02_laser
    frames: 5
    filename_template: fit/laser {pose_id}{index_suffix}{suffix}
    camera: {exposure_us: 300.0}
    pose_id: "001"
    role: laser
    instruction: 保持 48 mm 棋盘姿态 001 完全不动，只打开线激光；确认曝光、激光功率和机械状态后采集 5 帧。
    settle_frames: 5
    image_format: tif
    quality_mode: laser
    tags: {split: fit, group_index: 1, laser_state: on, recipe_role: laser, filename_prefix: laser, quality_mode_requested: laser}
  - task_id: fit_002_02_laser
